name: Update PSX prices

on:
  workflow_dispatch:        # manual run button
  schedule:
    # PSX hours ~9:15 AM – 3:30 PM PKT (PKT = UTC+5) => ~4:15–10:30 UTC
    # Runs every 20 minutes, Monday–Friday
    - cron: '*/20 4-11 * * 1-5'

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Fetch latest prices
        run: python update_prices.py
