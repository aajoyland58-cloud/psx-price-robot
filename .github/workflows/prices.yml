name: Update PSX prices

on:
  schedule:
    # Har 10 min, PSX market hours (approx 9:00–15:45 PKT = 04:00–10:45 UTC), Mon–Fri
    - cron: "*/10 4-10 * * 1-5"
  workflow_dispatch: {}   # manual run button

# purane runs cancel na hon, overlap avoid
concurrency:
  group: psx-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Fetch prices and push to Firebase
        run: python update_prices.py
